<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFit - Forgot password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <h1>Reset password</h1>
      <p>Enter your username and email, then pick a new password</p>

      <div id="error" class="error"></div>

    <label>Username</label>
    <input type="text" id="username">
    <label>Email</label>
    <input type="email" id="email">
    <label>New password</label>
    <input type="password" id="password">

      <button class="green" onclick="resetPassword()">Reset password</button>

      <p class="small-text"><a href="index.html">Back to login</a></p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
